<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Olius | Entrar</title>
<style>
*{box-sizing:border-box}
:root{--yellow:#ffc900;--cream:#fffbea;--text:#080808;--field:#f0f0f0}
html,body{margin:0;width:100%;min-height:100%;font-family:"Segoe UI",Arial,sans-serif;color:var(--text)}
body{min-height:100vh;min-height:100dvh;background:var(--cream);overflow-x:hidden}
.page{width:100%;min-height:100vh;min-height:100dvh}
.login-card{display:grid;grid-template-columns:1fr 1fr;width:100%;min-height:100vh;min-height:100dvh;background:#fff}
.intro{position:relative;min-height:100vh;min-height:100dvh;overflow:hidden;padding:clamp(55px,12vh,135px) clamp(35px,7.5vw,130px);border-right:1px solid #ded9c6;background:radial-gradient(ellipse at 80% 8%,rgba(255,220,54,.5),transparent 42%),radial-gradient(ellipse at 20% 100%,rgba(255,225,60,.72),transparent 55%),linear-gradient(135deg,#fffdf5,#fff8d8)}
.intro h1{position:relative;z-index:2;margin:0;font-size:clamp(28px,2.7vw,46px);line-height:1.45;letter-spacing:-1px;font-weight:750}
.dots{position:absolute;left:clamp(35px,7.5vw,130px);bottom:17%;width:65px;height:145px;opacity:.55;background-image:radial-gradient(circle,#ffc900 2px,transparent 2.2px);background-size:17px 17px}
.plant{position:absolute;left:clamp(125px,16vw,280px);bottom:4%;width:clamp(145px,17vw,280px);height:clamp(155px,20vw,300px);object-fit:contain;opacity:.75;filter:brightness(0) saturate(100%) invert(84%) sepia(94%) saturate(1695%) hue-rotate(359deg) brightness(103%) contrast(105%)}
.phone{position:absolute;z-index:3;right:clamp(35px,8vw,145px);bottom:3%;width:clamp(145px,13vw,220px);height:clamp(290px,29vw,490px);padding:7px;border:5px solid #090c0a;border-radius:30px;background:#090c0a;transform:rotate(10deg);box-shadow:8px 9px 6px #0005,2px 2px 0 #89927d}
.phone-screen{height:100%;overflow:hidden;padding:48px 12px 12px;border-radius:22px;text-align:center;background:linear-gradient(155deg,#fff0a1,#fff 43%,#fff2ad)}
.phone-brand{display:flex;justify-content:center;align-items:center;gap:3px;margin-bottom:28px;color:#eabb00;font-size:17px;font-weight:800}
.phone-brand img{width:21px;height:24px;object-fit:contain}
.phone-screen small{display:block;margin-bottom:14px;font-size:7px;color:#333}
.mini-option{margin:9px 0;padding:10px 6px;border:1px solid #e7e7e7;border-radius:6px;background:#ffffffd9;color:#666;font-size:6px;box-shadow:0 1px 2px #0002}
.mini-action{width:70%;margin:14px auto 0;padding:8px 3px;border-radius:5px;background:#eee;color:#777;font-size:6px}
.form-panel{min-height:100vh;min-height:100dvh;padding:clamp(30px,5vh,64px) clamp(28px,5vw,85px);background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center}
.brand{width:min(100%,500px);display:flex;align-items:center;gap:5px;margin:0 auto clamp(18px,3vh,34px);color:#f2bd00;font-size:clamp(22px,1.7vw,30px);font-weight:800;letter-spacing:-.5px}
.brand img{width:30px;height:34px;object-fit:contain}
.form-content{width:min(100%,500px);margin:0 auto}
h2{margin:0 0 4px;font-size:clamp(21px,1.5vw,28px);letter-spacing:-.5px}
.subtitle{margin:0 0 clamp(25px,4vh,42px);font-size:clamp(14px,.95vw,17px)}
.fields{display:grid;gap:16px}
.field{width:100%;height:46px;padding:0 18px;border:1px solid #ededed;border-radius:7px;outline:none;background:var(--field);box-shadow:0 3px 4px #0002;font:inherit;font-size:13px}
.field:focus{border-color:#e7bd22;box-shadow:0 0 0 3px #ffc90025}
.field::placeholder{color:#888}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:22px}
button{height:46px;border:0;border-radius:7px;font:inherit;font-size:13px;cursor:pointer;transition:filter .15s,transform .15s}
button:hover{filter:brightness(.97);transform:translateY(-1px)}
.cancel{color:#888;background:#f0f0f0;box-shadow:0 3px 4px #0002}
.enter{color:#111;background:var(--yellow);box-shadow:0 3px 4px #0003}
.divider{display:flex;align-items:center;gap:9px;margin:22px 2px 24px;color:#bcbcbc;font-size:11px}
.divider:before,.divider:after{content:"";height:1px;flex:1;background:#d9d9d9}
.social{display:grid;gap:15px}
.social-button{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;color:#858585;background:#f4f4f4;box-shadow:0 3px 4px #0002}
.social-button svg{width:15px;height:15px;flex:none}
.signup{margin:23px 0 0;text-align:center;font-size:11px;white-space:nowrap}
.signup a{color:#e9b900;font-weight:700;text-decoration:none}
.signup a:hover{text-decoration:underline}
@media(max-width:760px){
 .login-card{grid-template-columns:1fr;grid-template-rows:34svh auto}
 .intro{min-height:250px;height:34svh;padding:28px 25px;border-right:0;border-bottom:1px solid #ded9c6}
 .intro h1{max-width:230px;font-size:clamp(21px,5vw,27px)}
 .dots{left:25px;bottom:20px;width:45px;height:65px;background-size:13px 13px}
 .plant{left:110px;bottom:0;width:85px;height:95px}
 .phone{right:30px;bottom:5px;width:78px;height:160px;padding:4px;border-radius:16px}
 .phone-screen{padding:23px 5px 5px;border-radius:11px}
 .phone-brand{font-size:8px;margin-bottom:8px}
 .phone-brand img{width:10px;height:12px}
 .phone-screen small{font-size:3.5px;margin-bottom:4px}
 .mini-option{margin:3px 0;padding:4px 2px;font-size:3px}
 .mini-action{margin-top:5px;padding:4px 2px;font-size:3px}
 .form-panel{min-height:66svh;padding:22px clamp(22px,7vw,40px) 30px}
 .brand{width:min(100%,420px);margin-bottom:12px;font-size:20px}
 .brand img{width:25px;height:28px}
 .form-content{width:min(100%,420px)}
 h2{font-size:19px}
 .subtitle{font-size:13px;margin-bottom:22px}
 .field,button{height:42px;font-size:12px}
 .signup{font-size:10px}
}
@media(max-width:380px){
 .intro{min-height:235px;padding:22px 18px}
 .intro h1{max-width:180px;font-size:20px}
 .phone{right:18px;width:70px;height:145px}
 .plant{left:88px;width:75px;height:85px}
 .form-panel{padding-left:18px;padding-right:18px}
 .actions{gap:14px}
}
</style>
</head>
